{% extends "base.html" %}
{% block title %}{{ 'Editar' if equipo else 'Nuevo' }} equipo | InventarioTI{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="h3 mb-4">{{ 'Editar equipo' if equipo else 'Nuevo equipo' }}</h1>

    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre</label>
              <input name="nombre" class="form-control" required
                     value="{{ equipo.nombre if equipo else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Tipo</label>
              <select name="tipo" class="form-select" required>
                <option value="" disabled {{ '' if equipo else 'selected' }}>Selecciona...</option>
                {% for t in tipos %}
                <option value="{{ t }}" {{ 'selected' if equipo and equipo.tipo == t else '' }}>{{ t }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Marca</label>
              <input name="marca" class="form-control"
                     value="{{ equipo.marca if equipo else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Modelo</label>
              <input name="modelo" class="form-control"
                     value="{{ equipo.modelo if equipo else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Serial</label>
              <input name="serial" class="form-control" required
                     value="{{ equipo.serial if equipo else '' }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado</label>
              <select name="estado" class="form-select">
                {% for s in estados %}
                <option value="{{ s }}" {{ 'selected' if equipo and equipo.estado == s else '' }}>{{ s }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-12">
              <label class="form-label">Proveedor</label>
              <select name="proveedor_id" class="form-select">
                <option value="">Sin proveedor</option>
                {% for p in proveedores %}
                <option value="{{ p.id }}"
                  {{ 'selected' if equipo and equipo.proveedor_id == p.id else '' }}>
                  {{ p.nombre }}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>Guardar
            </button>
            <a href="{{ url_for('equipos.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
